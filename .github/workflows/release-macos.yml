name: Release macOS
on:
  push:
    tags: ['macos-v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - run: npm run dist -- --mac --publish never
      - name: Test packaged universal app
        env:
          PODCASTSTEAM_EXECUTABLE: ${{ github.workspace }}/dist/mac-universal/PodcastSteam.app/Contents/MacOS/PodcastSteam
        run: npm run test:e2e
      - name: Check architectures and signature
        run: |
          lipo -verify_arch arm64 x86_64 dist/mac-universal/PodcastSteam.app/Contents/MacOS/PodcastSteam
          codesign --verify --deep --strict --verbose=2 dist/mac-universal/PodcastSteam.app
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 PodcastSteam-*-mac-universal.dmg > SHA256SUMS-macOS
      - name: Attach macOS package to existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_REF#macos-}"
          EXPECTED_TAG="v$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "$EXPECTED_TAG"
          gh release upload "$RELEASE_TAG" dist/*-mac-universal.dmg dist/SHA256SUMS-macOS --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
